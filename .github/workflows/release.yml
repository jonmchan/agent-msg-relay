name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing for release.yml

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Match tag to Cargo.toml version
        run: |
          PKG="$(awk '/^\[workspace.package\]/{found=1} found && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "VERSION=$PKG" >> "$GITHUB_ENV"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "Tag v${TAG} does not match workspace version ${PKG} in Cargo.toml" >&2
              exit 1
            fi
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify committed binaries embed this version
        run: |
          strings bin/x86_64-unknown-linux-musl/agent-msg-relay | grep -F "${VERSION}" >/dev/null

      - name: Write release notes
        if: github.event_name == 'push'
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## Summary"
            echo
            if [ -n "$PREV" ]; then
              git log --format='- %s (%h)' "${PREV}..HEAD"
            else
              git log --format='- %s (%h)' -20
            fi
            echo
            echo "## Assets"
            echo
            echo "| File | Platform |"
            echo "| --- | --- |"
            echo "| \`agent-msg-relay-aarch64-apple-darwin\` | macOS Apple Silicon |"
            echo "| \`agent-msg-relay-x86_64-apple-darwin\` | macOS Intel |"
            echo "| \`agent-msg-relay-aarch64-unknown-linux-musl\` | Linux arm64 (musl) |"
            echo "| \`agent-msg-relay-x86_64-unknown-linux-musl\` | Linux x86_64 (musl) |"
            echo "| \`agent-msg-relay-x86_64-pc-windows-gnu.exe\` | Windows x64 |"
            echo "| \`SHA256SUMS\` | Checksums for committed \`bin/\` layout |"
            echo
            echo "Build from source on this tag: \`cargo build --release -p agent-msg-relay\`."
            echo
            echo "When \`bin/\` is missing: \`npm exec --yes --ignore-scripts --package=agent-msg-relay@${VERSION} -- agent-msg-relay\`."
            echo
            echo "Release process: [docs/release.md](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/docs/release.md)."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file release-notes.md
          fi
          ASSET_DIR="$(mktemp -d)"
          cp bin/aarch64-apple-darwin/agent-msg-relay "${ASSET_DIR}/agent-msg-relay-aarch64-apple-darwin"
          cp bin/x86_64-apple-darwin/agent-msg-relay "${ASSET_DIR}/agent-msg-relay-x86_64-apple-darwin"
          cp bin/aarch64-unknown-linux-musl/agent-msg-relay "${ASSET_DIR}/agent-msg-relay-aarch64-unknown-linux-musl"
          cp bin/x86_64-unknown-linux-musl/agent-msg-relay "${ASSET_DIR}/agent-msg-relay-x86_64-unknown-linux-musl"
          cp bin/x86_64-pc-windows-gnu/agent-msg-relay.exe "${ASSET_DIR}/agent-msg-relay-x86_64-pc-windows-gnu.exe"
          cp bin/SHA256SUMS "${ASSET_DIR}/SHA256SUMS"
          gh release upload "v${VERSION}" "${ASSET_DIR}/"* --clobber

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish npm packages
        run: ./scripts/publish-npm.sh
