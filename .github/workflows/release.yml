name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Match tag to Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(awk '/^\[workspace.package\]/{found=1} found && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match workspace version ${PKG} in Cargo.toml" >&2
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify committed binaries report this version
        run: |
          strings bin/x86_64-unknown-linux-musl/agent-msg-relay | grep -F "agent-msg-relay ${VERSION}" >/dev/null

      - name: Write release notes
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## Summary"
            echo
            if [ -n "$PREV" ]; then
              git log --format='- %s (%h)' "${PREV}..HEAD"
            else
              git log --format='- %s (%h)' -20
            fi
            echo
            echo "## Assets"
            echo
            echo "| File | Platform |"
            echo "| --- | --- |"
            echo "| \`agent-msg-relay-aarch64-apple-darwin\` | macOS Apple Silicon |"
            echo "| \`agent-msg-relay-x86_64-apple-darwin\` | macOS Intel |"
            echo "| \`agent-msg-relay-aarch64-unknown-linux-musl\` | Linux arm64 (musl) |"
            echo "| \`agent-msg-relay-x86_64-unknown-linux-musl\` | Linux x86_64 (musl) |"
            echo "| \`agent-msg-relay-x86_64-pc-windows-gnu.exe\` | Windows x64 |"
            echo "| \`SHA256SUMS\` | Checksums for committed \`bin/\` layout |"
            echo
            echo "Build from source on this tag: \`cargo build --release -p agent-msg-relay\`."
            echo
            echo "Release process: [docs/release.md](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/docs/release.md)."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
          gh release upload "v${VERSION}" \
            bin/aarch64-apple-darwin/agent-msg-relay#agent-msg-relay-aarch64-apple-darwin \
            bin/x86_64-apple-darwin/agent-msg-relay#agent-msg-relay-x86_64-apple-darwin \
            bin/aarch64-unknown-linux-musl/agent-msg-relay#agent-msg-relay-aarch64-unknown-linux-musl \
            bin/x86_64-unknown-linux-musl/agent-msg-relay#agent-msg-relay-x86_64-unknown-linux-musl \
            bin/x86_64-pc-windows-gnu/agent-msg-relay.exe#agent-msg-relay-x86_64-pc-windows-gnu.exe \
            bin/SHA256SUMS
