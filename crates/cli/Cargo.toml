[package]
name = "agent-msg-relay"
version.workspace = true
edition.workspace = true
description = "Cross-platform client for the agent-msg-relay protocol"
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-msg-relay"
path = "src/main.rs"

[dependencies]
agent-msg-relay-protocol.workspace = true
clap = { version = "4", features = ["derive"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }
