[package]
name = "agent-msg-relay-protocol"
version.workspace = true
edition.workspace = true
description = "Canonical signing, envelope, and ECIES wraps for agent-msg-relay"
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "sha256"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"
